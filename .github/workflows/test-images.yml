# Publishes both images under the :test tag from a test/** branch, so a change
# can be tried in a real dev container or IG build before it reaches :latest.
#
# Chain for a full test: push to test/** here -> ig-publisher:test and
# ig-publisher-with-snapshot-support:test, then push to test/** in
# igpublisher-devcontainer-image, which builds on the :test snapshot image.
# Point a test repository's devcontainer.json and workflow at the :test tags.
#
# Neither :latest nor any release tag is touched, and no release is created.

name: Publish Test Images

on:
  push:
    branches:
      - 'test/**'

concurrency:
  group: test-images
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  STANDARD_IMAGE: ghcr.io/gefyra/ig-publisher
  SNAPSHOT_IMAGE: ghcr.io/gefyra/ig-publisher-with-snapshot-support

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push standard image (:test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.STANDARD_IMAGE }}:test

      - name: Build and push snapshot support image (:test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.with-snapshot-support
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.STANDARD_IMAGE }}:test
          tags: ${{ env.SNAPSHOT_IMAGE }}:test

      - name: Report tool versions
        run: |
          docker run --rm ${{ env.SNAPSHOT_IMAGE }}:test bash -c '
            echo "Node.js:  $(node --version)"
            echo "SUSHI:    $(sushi --version | head -1)"
            echo "Java:     $(java --version 2>&1 | head -1)"
            echo "Jekyll:   $(jekyll --version)"
          ' | tee -a "$GITHUB_STEP_SUMMARY"
