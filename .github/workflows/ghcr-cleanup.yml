name: GHCR Package Cleanup

on:
  schedule:
    # Daily cleanup to prevent package storage growth
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        required: false
        type: boolean
        default: true
      keep_tagged:
        description: "How many non-protected tagged versions to keep per package"
        required: false
        type: number
        default: 30
      keep_untagged:
        description: "How many untagged versions to keep per package (0 = remove all)"
        required: false
        type: number
        default: 0

env:
  PACKAGE_TYPE: container
  PACKAGE_LIST: ig-publisher,ig-publisher-with-snapshot-support,igpublisher-devcontainer,igpublisher-devcontainer-image
  # Current release workflows publish "latest" and versioned tags
  PROTECTED_TAGS: latest
  DEFAULT_KEEP_TAGGED: 30
  DEFAULT_KEEP_UNTAGGED: 0

jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: ghcr-cleanup
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Cleanup old GHCR package versions
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PACKAGE_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const org = context.repo.owner;
            const packageType = process.env.PACKAGE_TYPE;
            const packageNames = process.env.PACKAGE_LIST
              .split(",")
              .map((item) => item.trim())
              .filter(Boolean);
            const protectedTags = new Set(
              process.env.PROTECTED_TAGS
                .split(",")
                .map((tag) => tag.trim().toLowerCase())
                .filter(Boolean)
            );

            const parseRetentionNumber = (value, fallback, name) => {
              const raw = (value || "").trim();
              const parsed = Number(raw === "" ? fallback : raw);
              if (!Number.isInteger(parsed) || parsed < 0) {
                throw new Error(`Invalid ${name} value: "${raw}"`);
              }
              return parsed;
            };

            const keepTagged = parseRetentionNumber(
              core.getInput("keep_tagged"),
              process.env.DEFAULT_KEEP_TAGGED,
              "keep_tagged"
            );
            const keepUntagged = parseRetentionNumber(
              core.getInput("keep_untagged"),
              process.env.DEFAULT_KEEP_UNTAGGED,
              "keep_untagged"
            );
            const dryRunInput = core.getInput("dry_run");
            const dryRun = dryRunInput === "" ? context.eventName === "workflow_dispatch" : dryRunInput === "true";

            core.info(`Cleanup mode: ${dryRun ? "DRY RUN" : "DELETE"}`);
            core.info(`Retention: keep_tagged=${keepTagged}, keep_untagged=${keepUntagged}`);
            core.info(`Protected tags: ${Array.from(protectedTags).join(", ")}`);

            const toDate = (value) => new Date(value).getTime();
            const byCreatedDesc = (a, b) => toDate(b.created_at) - toDate(a.created_at);
            const deleted = [];
            const planned = [];

            for (const packageName of packageNames) {
              core.startGroup(`Package: ${packageName}`);
              let versions = [];

              try {
                versions = await github.paginate(
                  "GET /orgs/{org}/packages/{package_type}/{package_name}/versions",
                  {
                    org,
                    package_type: packageType,
                    package_name: packageName,
                    per_page: 100
                  }
                );
              } catch (error) {
                if (error.status === 404) {
                  core.warning(`Package not found or inaccessible: ${packageName}`);
                  core.endGroup();
                  continue;
                }
                throw error;
              }

              const tagged = [];
              const untagged = [];
              const protectedVersions = [];

              for (const version of versions) {
                const tags = version.metadata?.container?.tags || [];
                if (tags.length === 0) {
                  untagged.push(version);
                  continue;
                }

                const hasProtectedTag = tags.some((tag) => protectedTags.has(tag.toLowerCase()));
                if (hasProtectedTag) {
                  protectedVersions.push(version);
                } else {
                  tagged.push(version);
                }
              }

              tagged.sort(byCreatedDesc);
              untagged.sort(byCreatedDesc);
              protectedVersions.sort(byCreatedDesc);

              const deleteCandidates = [
                ...tagged.slice(keepTagged),
                ...untagged.slice(keepUntagged)
              ];

              core.info(`Total versions: ${versions.length}`);
              core.info(`Protected tagged versions: ${protectedVersions.length}`);
              core.info(`Non-protected tagged versions: ${tagged.length}`);
              core.info(`Untagged versions: ${untagged.length}`);
              core.info(`Delete candidates: ${deleteCandidates.length}`);

              for (const version of deleteCandidates) {
                const tags = version.metadata?.container?.tags || [];
                const description = {
                  package: packageName,
                  id: version.id,
                  created_at: version.created_at,
                  tags
                };

                if (dryRun) {
                  planned.push(description);
                  core.info(`[DRY RUN] Would delete version ${version.id} (${tags.length ? tags.join(",") : "untagged"})`);
                  continue;
                }

                try {
                  await github.request(
                    "DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}",
                    {
                      org,
                      package_type: packageType,
                      package_name: packageName,
                      package_version_id: version.id
                    }
                  );
                  deleted.push(description);
                  core.info(`Deleted version ${version.id} (${tags.length ? tags.join(",") : "untagged"})`);
                } catch (error) {
                  core.warning(
                    `Failed to delete version ${version.id} from ${packageName}: ${error.message}`
                  );
                }
              }

              core.endGroup();
            }

            const summaryLines = [];
            summaryLines.push("## GHCR Cleanup Summary");
            summaryLines.push("");
            summaryLines.push(`- Mode: ${dryRun ? "DRY RUN" : "DELETE"}`);
            summaryLines.push(`- keep_tagged: ${keepTagged}`);
            summaryLines.push(`- keep_untagged: ${keepUntagged}`);
            summaryLines.push(`- Protected tags: ${Array.from(protectedTags).join(", ")}`);
            summaryLines.push(`- Planned deletions: ${planned.length}`);
            summaryLines.push(`- Executed deletions: ${deleted.length}`);

            await core.summary.addRaw(summaryLines.join("\n")).write();
